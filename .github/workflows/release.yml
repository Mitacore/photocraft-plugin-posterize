name: Build and release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        shell: pwsh
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Test
        shell: pwsh
        run: cargo +stable test --locked
      - name: Build
        shell: pwsh
        run: cargo +stable build --release --locked --target wasm32-unknown-unknown
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/wasm32-unknown-unknown/release/photocraft_plugin_posterize.wasm dist/posterize.wasm
          $h = (Get-FileHash dist/posterize.wasm -Algorithm SHA256).Hash.ToLower()
          "$h  posterize.wasm" | Set-Content -Encoding ascii dist/posterize.wasm.sha256
          Get-Item dist/* | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: posterize
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/posterize.wasm dist/posterize.wasm.sha256 --title "Posterize ${{ github.ref_name }}" --notes "WebAssembly filter plug-in for PhotoCraft (ABI v1). Download posterize.wasm and verify it against posterize.wasm.sha256."
