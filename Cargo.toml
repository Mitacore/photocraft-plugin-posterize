[package]
name = "photocraft-plugin-posterize"
description = "PhotoCraft WebAssembly filter plug-in: Posterize"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
